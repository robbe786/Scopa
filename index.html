<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sisal Scopa 1vs1 Autopilot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #121212; color: #fff; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    #camera-container { flex: 1 1 auto; position: relative; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; }
    video { width: 100%; height: 100%; object-fit: cover; }
    
    /* Box 1: Centro tavolo Sisal (rilevamento giocata) */
    #motion-zone {
      position: absolute;
      border: 2px dashed #22c55e;
      width: 70%;
      height: 38%;
      pointer-events: none;
      border-radius: 8px;
    }

    /* Box 2: Zona timer / Cuore rosso Hero in basso */
    #turn-zone {
      position: absolute;
      bottom: 6%;
      border: 2px solid #ef4444;
      width: 25%;
      height: 10%;
      pointer-events: none;
      border-radius: 6px;
      background: rgba(239, 68, 68, 0.15);
    }
    
    #status-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0,0,0,0.8);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid #444;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; }
    .dot-motion { background: #eab308; }
    .dot-hero { background: #ef4444; }

    #panel { flex: 0 0 auto; background: #1a1a1a; padding: 12px 16px 20px; display: flex; flex-direction: column; gap: 8px; border-top: 2px solid #333; }
    #decision { font-size: 1.7rem; font-weight: 900; text-align: center; color: #38bdf8; min-height: 2.1rem; }
    #details { font-size: 0.85rem; color: #ccc; min-height: 2.8em; line-height: 1.4; }
    
    .btn-row { display: flex; gap: 8px; }
    #btn-mode { flex: 2; padding: 14px; font-size: 1rem; font-weight: bold; color: white; background: #10b981; border: none; border-radius: 10px; cursor: pointer; }
    #btn-reset { flex: 1; padding: 14px; font-size: 0.9rem; background: #374151; color: white; border: none; border-radius: 10px; cursor: pointer; }

    #api-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: flex; justify-content: center; align-items: center; padding: 20px; z-index: 100; }
    .modal-content { background: #222; padding: 20px; border-radius: 12px; width: 100%; max-width: 350px; border: 1px solid #333; }
    .modal-content input { width: 100%; padding: 12px; margin: 12px 0; border-radius: 6px; border: 1px solid #444; background: #111; color: white; }
    .modal-content button { width: 100%; padding: 12px; background: #2563eb; border: none; border-radius: 6px; color: white; font-weight: bold; }
  </style>
</head>
<body>

  <div id="api-modal">
    <div class="modal-content">
      <h3>Gemini API Key</h3>
      <input type="text" id="api-key-input" placeholder="Incolla chiave AIza...">
      <button id="save-key-btn">Salva e Avvia</button>
    </div>
  </div>

  <div id="camera-container">
    <video id="video" autoplay playsinline muted></video>
    <div id="motion-zone"></div>
    <div id="turn-zone"></div>
    <div id="status-badge">
      <div id="indicator" class="dot"></div>
      <span id="batch-count">AUTOPILOT ATTIVO</span>
    </div>
  </div>

  <div id="panel">
    <div id="decision">IN ATTESA DEL TURNO</div>
    <div id="details">Allinea il box rosso sul cuore/timer in basso. Giocherà da solo a ogni tuo turno.</div>
    <div class="btn-row">
      <button id="btn-mode">Auto: ON</button>
      <button id="btn-reset">Nuova Smazzata</button>
    </div>
  </div>

  <canvas id="motion-canvas" width="160" height="120" style="display:none;"></canvas>
  <canvas id="turn-canvas" width="40" height="40" style="display:none;"></canvas>
  <canvas id="capture-canvas" style="display:none;"></canvas>

  <script>
    const SYSTEM_PROMPT = `Sei un bot imbattibile di Scopa classica 1vs1 su Sisal.it.
Mazzo: NAPOLETANO REGIONALE (d=Denari/Ori, c=Coppe, s=Spade, b=Bastoni. Valori da 1 a 7, 8=Fante, 9=Cavallo, 10=Re).
Tavolo verde centrale + mano di Hero in basso.

REGOLE TATTICHE:
1. Punti: Settebello (7d), Primiera (tutti i 7 e 6), Denari (>=6 vincono), Carte totali (>=21), Scope.
2. PRESA OBBLIGATORIA A CARTA SINGOLA: Se c'è una carta a terra di valore nominale uguale, obbligo di prendere quella e non la combinazione.
3. DIFESA RIGOROSA: Non lasciare mai somme totali o parziali <= 10 facilmente accoppiabili, a meno di conteggio sicuro.
4. MEMORIA FERREA: Usa lo storico per sapere quali carte restano nel mazzo e in mano all'avversario.

Rispondi ESCLUSIVAMENTE in JSON senza markdown o backtick:
{
  "carta_consigliata": "es: 7d",
  "azione": "Presa (es: Prende 7s) o Calata",
  "motivo": "Spiegazione tattica",
  "carte_mano_hero": ["es: 7d", "2c"],
  "carte_tavolo": ["carte a terra"],
  "nuove_carte_uscite": ["carte uscite/prese in questa giocata"]
}`;

    let apiKey = localStorage.getItem('GEMINI_API_KEY') || '';
    let carteUscite = [];
    let opponentLastSnapshot = null;
    let isProcessing = false;
    let autoMode = true;

    const video = document.getElementById('video');
    const motionCanvas = document.getElementById('motion-canvas');
    const mCtx = motionCanvas.getContext('2d', { willReadFrequently: true });
    const turnCanvas = document.getElementById('turn-canvas');
    const tCtx = turnCanvas.getContext('2d', { willReadFrequently: true });
    const captureCanvas = document.getElementById('capture-canvas');
    const cCtx = captureCanvas.getContext('2d');

    const btnMode = document.getElementById('btn-mode');
    const btnReset = document.getElementById('btn-reset');
    const decisionEl = document.getElementById('decision');
    const detailsEl = document.getElementById('details');
    const batchCountEl = document.getElementById('batch-count');
    const indicatorEl = document.getElementById('indicator');
    const apiModal = document.getElementById('api-modal');

    if (apiKey) {
      apiModal.style.display = 'none';
      initApp();
    }

    document.getElementById('save-key-btn').onclick = () => {
      apiKey = document.getElementById('api-key-input').value.trim();
      if (apiKey) {
        localStorage.setItem('GEMINI_API_KEY', apiKey);
        apiModal.style.display = 'none';
        initApp();
      }
    };

    btnMode.onclick = () => {
      autoMode = !autoMode;
      btnMode.innerText = autoMode ? "Auto: ON" : "Auto: PAUSA";
      btnMode.style.background = autoMode ? "#10b981" : "#4b5563";
    };

    btnReset.onclick = () => {
      carteUscite = [];
      opponentLastSnapshot = null;
      decisionEl.innerText = "NUOVA SMAZZATA";
      detailsEl.innerText = "Contatore 40 carte resettato. In attesa del primo giro.";
      batchCountEl.innerText = "AUTOPILOT ATTIVO";
      indicatorEl.className = "dot";
    };

    async function initApp() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 } },
          audio: false
        });
        video.srcObject = stream;
        video.onloadedmetadata = () => {
          startVisionLoop();
        };
      } catch (err) {
        alert("Errore fotocamera: " + err.message);
      }
    }

    // ==========================================
    // VISION LOOP AUTOMATICO (Motion + Hero Turn)
    // ==========================================
    let prevImageData = null;
    let motionDetected = false;
    let calmFramesCount = 0;
    let turnTriggeredForThisCycle = false;

    function startVisionLoop() {
      setInterval(() => {
        if (!autoMode || isProcessing || video.videoWidth === 0) return;

        // 1. Rilevamento movimento al centro tavolo (Giocata avversario)
        const sw = video.videoWidth * 0.70;
        const sh = video.videoHeight * 0.38;
        const sx = (video.videoWidth - sw) / 2;
        const sy = (video.videoHeight - sh) / 2;

        mCtx.drawImage(video, sx, sy, sw, sh, 0, 0, motionCanvas.width, motionCanvas.height);
        const current = mCtx.getImageData(0, 0, motionCanvas.width, motionCanvas.height);

        if (prevImageData) {
          let diffScore = 0;
          const d1 = prevImageData.data;
          const d2 = current.data;
          
          for (let i = 0; i < d1.length; i += 8) {
            const diff = Math.abs(d1[i] - d2[i]) + Math.abs(d1[i+1] - d2[i+1]) + Math.abs(d1[i+2] - d2[i+2]);
            if (diff > 80) diffScore++;
          }

          if (diffScore > 28) {
            motionDetected = true;
            calmFramesCount = 0;
            turnTriggeredForThisCycle = false; // Nuovo giro partito
            indicatorEl.className = "dot dot-motion";
            batchCountEl.innerText = "Avversario sta giocando...";
          } else if (motionDetected) {
            calmFramesCount++;
            if (calmFramesCount >= 4) { // Animazione finita
              catturaFrameAvversario();
              motionDetected = false;
              calmFramesCount = 0;
              indicatorEl.className = "dot";
              batchCountEl.innerText = "In attesa tuo turno...";
            }
          }
        }
        prevImageData = current;

        // 2. Rilevamento colore rosso/attivo sul Cuore/Timer di Hero in basso
        if (!motionDetected && !turnTriggeredForThisCycle) {
          const tw = video.videoWidth * 0.25;
          const th = video.videoHeight * 0.10;
          const tx = (video.videoWidth - tw) / 2;
          const ty = video.videoHeight * 0.84; // Posizione del timer di Sisal

          tCtx.drawImage(video, tx, ty, tw, th, 0, 0, turnCanvas.width, turnCanvas.height);
          const turnData = tCtx.getImageData(0, 0, turnCanvas.width, turnCanvas.height).data;

          let redPixels = 0;
          for (let i = 0; i < turnData.length; i += 4) {
            const r = turnData[i];
            const g = turnData[i+1];
            const b = turnData[i+2];
            // Riconosce il rosso acceso del cuore/timer di Sisal
            if (r > 150 && g < 70 && b < 70) {
              redPixels++;
            }
          }

          // Se il cuore rosso è attivo a schermo, tocca a te!
          if (redPixels > 15) {
            turnTriggeredForThisCycle = true;
            indicatorEl.className = "dot dot-hero";
            batchCountEl.innerText = "Tocca a te! Elaborazione...";
            eseguiChiamataAI();
          }
        }
      }, 200);
    }

    function catturaFrameAvversario() {
      captureCanvas.width = 1280;
      captureCanvas.height = 720;
      cCtx.drawImage(video, 0, 0, captureCanvas.width, captureCanvas.height);
      opponentLastSnapshot = captureCanvas.toDataURL('image/jpeg', 0.8).split(',')[1];
    }

    // ==========================================
    // CHIAMATA API A ZERO CLICK
    // ==========================================
    async function eseguiChiamataAI() {
      if (!apiKey || isProcessing) return;

      isProcessing = true;
      decisionEl.innerText = "CALCOLO...";

      try {
        captureCanvas.width = 1600;
        captureCanvas.height = 900;
        cCtx.drawImage(video, 0, 0, captureCanvas.width, captureCanvas.height);
        const currentFrameBase64 = captureCanvas.toDataURL('image/jpeg', 0.85).split(',')[1];

        const promptText = `
        CARTE USCITE (${carteUscite.length}/40): [ ${carteUscite.join(', ') || 'Inizio partita'} ]
        ${opponentLastSnapshot ? "- C'è lo scatto dell'azione avversaria registrata prima di questo turno." : ""}
        - Immagine corrente: la mia mano in basso e il panno verde centrale.
        Cosa devo giocare subito?
        `;

        const parts = [{ text: promptText }];
        if (opponentLastSnapshot) {
          parts.push({ inline_data: { mime_type: "image/jpeg", data: opponentLastSnapshot } });
        }
        parts.push({ inline_data: { mime_type: "image/jpeg", data: currentFrameBase64 } });

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ role: "user", parts: parts }],
            system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
            generationConfig: {
              response_mime_type: "application/json",
              temperature: 0.1
            }
          })
        });

        const resData = await response.json();
        if (resData.error) throw new Error(resData.error.message);

        const parsed = JSON.parse(resData.candidates[0].content.parts[0].text);

        decisionEl.innerText = `${parsed.carta_consigliata} ➜ ${parsed.azione}`;
        detailsEl.innerHTML = `
          • <b>Tattica:</b> ${parsed.motivo}<br>
          • <b>Mano:</b> [ ${parsed.carte_mano_hero ? parsed.carte_mano_hero.join(' ') : '-'} ]<br>
          • <b>Tavolo:</b> [ ${parsed.carte_tavolo ? parsed.carte_tavolo.join(' ') : '-'} ] | Uscite: ${carteUscite.length + (parsed.nuove_carte_uscite ? parsed.nuove_carte_uscite.length : 0)}/40
        `;

        if (parsed.nuove_carte_uscite && Array.isArray(parsed.nuove_carte_uscite)) {
          carteUscite.push(...parsed.nuove_carte_uscite);
        }

        opponentLastSnapshot = null;

      } catch (err) {
        decisionEl.innerText = "ERRORE";
        detailsEl.innerText = err.message;
      } finally {
        isProcessing = false;
        batchCountEl.innerText = "AUTOPILOT ATTIVO";
      }
    }
  </script>
</body>
</html>

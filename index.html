<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Scopone 4 in 2 - Chitarrella Grandmaster</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0b0f19; color: #fff; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    
    #camera-container { flex: 1 1 auto; min-height: 0; position: relative; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; }
    video { width: 100%; height: 100%; object-fit: cover; }
    
    #overlay-box { 
      position: absolute; 
      border: 2px dashed #38bdf8; 
      width: 86%; 
      height: 68%; 
      left: 7%; 
      top: 16%; 
      pointer-events: none; 
      border-radius: 8px; 
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.65); 
    }

    #dashboard { flex: 0 0 auto; background: #111827; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; border-top: 2px solid #1f2937; max-height: 52vh; overflow-y: auto; }
    
    #decision-box {
      background: #030712;
      border: 2px solid #10b981;
      border-radius: 10px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #decision { 
      font-size: 2rem; 
      font-weight: 900; 
      color: #10b981; 
      letter-spacing: 0.5px; 
      line-height: 1.1;
    }
    #active-player { 
      font-size: 0.85rem; 
      font-weight: bold; 
      color: #38bdf8; 
      text-transform: uppercase;
      background: #1e293b;
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #334155;
    }

    #tactic-box {
      background: #1f2937;
      padding: 8px 10px;
      border-radius: 6px;
      border-left: 4px solid #38bdf8;
      font-size: 0.88rem;
      line-height: 1.35;
      color: #f3f4f6;
      min-height: 2.8em;
    }

    .state-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      font-size: 0.78rem;
    }
    .pill {
      background: #374151;
      padding: 4px 6px;
      border-radius: 4px;
      font-family: monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pill-full { grid-column: span 2; }

    .action-row {
      display: flex;
      gap: 8px;
      margin-top: 2px;
    }
    #btn-action { 
      flex: 3; 
      padding: 14px; 
      font-size: 1.2rem; 
      font-weight: 900; 
      color: white; 
      background: #0284c7; 
      border: none; 
      border-radius: 10px; 
      cursor: pointer; 
    }
    #btn-action:active { background: #0369a1; }
    #btn-action:disabled { background: #4b5563; cursor: not-allowed; }

    #btn-reset {
      flex: 1;
      padding: 14px 8px;
      font-size: 0.85rem;
      font-weight: bold;
      color: #000;
      background: #facc15;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    #api-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: flex; justify-content: center; align-items: center; padding: 20px; z-index: 100; }
    .modal-content { background: #1f2937; padding: 20px; border-radius: 12px; width: 100%; max-width: 350px; }
    .modal-content input { width: 100%; padding: 12px; margin: 12px 0; border-radius: 6px; border: 1px solid #4b5563; background: #111827; color: white; font-size: 0.95rem; }
    .modal-content button { width: 100%; padding: 12px; background: #0284c7; border: none; border-radius: 6px; color: white; font-weight: bold; }
  </style>
</head>
<body>

  <div id="api-modal">
    <div class="modal-content">
      <h3 style="color:#fff;">Gemini API Key</h3>
      <input type="text" id="api-key-input" placeholder="Incolla chiave AI Studio...">
      <button id="save-key-btn">Salva</button>
    </div>
  </div>

  <div id="camera-container">
    <video id="video" autoplay playsinline muted></video>
    <div id="overlay-box"></div>
  </div>

  <div id="dashboard">
    <div id="decision-box">
      <div id="decision">PRONTO</div>
      <div id="active-player">STANDBY</div>
    </div>

    <div id="tactic-box">NUOVA SMAZZATA al primo turno, poi scatta col telecomando.</div>

    <div class="state-grid">
      <div class="pill" id="pill-nord">Nord: -</div>
      <div class="pill" id="pill-sud">Sud: -</div>
      <div class="pill pill-full" id="pill-table">Terra: -</div>
      <div class="pill pill-full" id="pill-tracker" style="color: #38bdf8;">Nemici: 20 carte ignote da dedurre</div>
    </div>

    <div class="action-row">
      <button id="btn-reset">NUOVA SMAZZATA</button>
      <button id="btn-action">SCATTA / [BT REMOTE]</button>
    </div>
  </div>

  <canvas id="canvas-upload" style="display: none;"></canvas>

  <script>
    const SYSTEM_PROMPT = `Sei il Grande Maestro e Campione del Mondo di Scopone Scientifico a 40 carte francesi.
Assisti il giocatore in modalita 4 in 2 (controlla SUD e NORD contro EST e OVEST).

REGOLE TASSATIVE:
1. Valori: A=1, 2..7 nominali, J (Fante)=8, Q (Donna)=9, K (Re)=10.
2. Semi: C (Cuori), Q (Quadri/Denari), F (Fiori), P (Picche).
3. PRESA SINGOLA OBBLIGATORIA: se giochi X e a terra c'e sia un X singolo sia una somma X, DEVI prendere il singolo.
4. NESSUN OBBLIGO DI PRESA DA MANO: puoi giocare qualsiasi carta hai in mano, ma se giochi una carta che fa presa, il software Sisal prende automaticamente.
5. Punti: Carte (21+), Quadri (6+), Settebello (7Q), Primiera (7 > 6 > A), Scope.

EQUAZIONE DI BILANCIO PRESE NEMICHE:
Confronta il tavolo attuale con lo stato precedente descritto nel testo:
- Se mancano carte a terra, deduci la carta giocata dal nemico (carta singola o somma <= 10).
- Sottrai quel valore dal pool delle 20 carte nemiche iniziali.

VINCOLO FERREO ANTI-SCOPA SUL RESIDUO:
- Se una presa non fa scopa, calcola le carte RIMASTE a terra.
- Se il residuo e una carta singola o somma <= 10, e i nemici hanno ancora carte vive di quel valore, QUELLA PRESA E VIETATA.
- Preferisci scartare una carta che porti la terra a somma > 10 non pulibile con una sola carta.

STRATEGIA 4 IN 2:
- Tra SUD e NORD gioca un avversario.
- Puoi preparare il tavolo per il compagno SOLO se il valore lasciato a terra e assente dalla mano dell'avversario intermedio.

Rispondi con un JSON valido:
{
  "mano_nord": ["KC", "4Q", ...],
  "mano_sud": ["7Q", "AP", ...],
  "tavolo": ["3C", ...],
  "tocca_a": "SUD" oppure "NORD",
  "carta_consigliata": "7Q",
  "dettaglio": "Prende 7C (Residuo pulito)",
  "motivo": "Spiegazione tattica stringente in una riga",
  "nemici_vivi": "Sintesi (es. 14 rimasti, 7Q nostro, nemici hanno un 7 e due Re)"
}`;

    const video = document.getElementById('video');
    const canvasUpload = document.getElementById('canvas-upload');
    const btnAction = document.getElementById('btn-action');
    const btnReset = document.getElementById('btn-reset');
    const decisionEl = document.getElementById('decision');
    const activePlayerEl = document.getElementById('active-player');
    const tacticBoxEl = document.getElementById('tactic-box');
    const pillNord = document.getElementById('pill-nord');
    const pillSud = document.getElementById('pill-sud');
    const pillTable = document.getElementById('pill-table');
    const pillTracker = document.getElementById('pill-tracker');
    const apiModal = document.getElementById('api-modal');
    const apiKeyInput = document.getElementById('api-key-input');
    const saveKeyBtn = document.getElementById('save-key-btn');

    let apiKey = localStorage.getItem('GEMINI_API_KEY') || '';
    let textHistory = [];
    let turnCount = 0;

    function resetSession() {
      textHistory = [];
      turnCount = 0;
      decisionEl.innerText = "PRONTO";
      decisionEl.style.color = "#10b981";
      activePlayerEl.innerText = "STANDBY";
      pillNord.innerText = "Nord: -";
      pillSud.innerText = "Sud: -";
      pillTable.innerText = "Terra: -";
      pillTracker.innerText = "Nemici: 20 carte ignote da dedurre";
      tacticBoxEl.innerText = "Mazzo resettato. Fai il primo scatto all'avvio della smazzata.";
    }

    btnReset.onclick = resetSession;

    if (apiKey) {
      apiModal.style.display = 'none';
      startCamera();
    }

    saveKeyBtn.onclick = () => {
      apiKey = apiKeyInput.value.trim();
      if (apiKey) {
        localStorage.setItem('GEMINI_API_KEY', apiKey);
        apiModal.style.display = 'none';
        startCamera();
      }
    };

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920, min: 1280 }, height: { ideal: 1080, min: 720 } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
      } catch (err) {
        alert("Errore fotocamera: " + err.message);
      }
    }

    async function executeCapture() {
      if (btnAction.disabled) return;
      btnAction.disabled = true;
      activePlayerEl.innerText = "ANALISI MASTER...";
      decisionEl.innerText = "...";
      decisionEl.style.color = "#facc15";

      try {
        const srcWidth = video.videoWidth;
        const srcHeight = video.videoHeight;
        
        const cropW = srcWidth * 0.86;
        const cropH = srcHeight * 0.68;
        const cropX = srcWidth * 0.07;
        const cropY = srcHeight * 0.16;

        const targetWidth = 1400;
        canvasUpload.width = targetWidth;
        canvasUpload.height = (cropH / cropW) * targetWidth;

        const ctx = canvasUpload.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, canvasUpload.width, canvasUpload.height);
        
        const base64Image = canvasUpload.toDataURL('image/jpeg', 0.92).split(',')[1];

        // Costruiamo la richiesta: cronologia leggera (solo testo) + SOLO L'IMMAGINE ATTUALE
        const contentsPayload = [
          ...textHistory,
          {
            role: "user",
            parts: [
              { text: `Turno ${turnCount + 1}. Analizza la nuova foto, deduci le carte giocate dai nemici rispetto all'ultimo turno e fornisci la mossa ottimale.` },
              { inlineData: { mimeType: "image/jpeg", data: base64Image } }
            ]
          }
        ];

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            systemInstruction: {
              parts: [{ text: SYSTEM_PROMPT }]
            },
            contents: contentsPayload,
            generationConfig: {
              responseMimeType: "application/json",
              thinkingConfig: { thinkingLevel: "low" }
            }
          })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));

        const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!rawText) throw new Error("Risposta vuota");

        const parsed = JSON.parse(rawText);
        const nordCards = parsed.mano_nord || [];
        const sudCards = parsed.mano_sud || [];
        const tableCards = parsed.tavolo || [];
        const activeTurn = parsed.tocca_a || "SUD";
        const bestCard = parsed.carta_consigliata || "-";
        const detail = parsed.dettaglio || "";
        const reason = parsed.motivo || "";
        const enemyTracker = parsed.nemici_vivi || "";

        // Aggiorna lo storico solo testualmente per non appesantire le chiamate successive
        textHistory.push({
          role: "user",
          parts: [{ text: `Stato al Turno ${turnCount + 1}: Nord=[${nordCards.join(',')}], Sud=[${sudCards.join(',')}], Tavolo=[${tableCards.join(',')}], Turno=${activeTurn}` }]
        });
        textHistory.push({
          role: "model",
          parts: [{ text: rawText }]
        });

        turnCount++;

        pillNord.innerText = `Nord (${nordCards.length}): ${nordCards.join(' ')}`;
        pillSud.innerText = `Sud (${sudCards.length}): ${sudCards.join(' ')}`;
        pillTable.innerText = `Terra: ${tableCards.join(' ')}`;
        if (enemyTracker) pillTracker.innerText = `Nemici: ${enemyTracker}`;

        decisionEl.innerText = `${activeTurn}: ${bestCard}`;
        decisionEl.style.color = "#10b981";
        activePlayerEl.innerText = `TURNO ${activeTurn}`;
        tacticBoxEl.innerHTML = `<b>${detail}</b><br><span style="color:#94a3b8;">${reason}</span>`;

      } catch (err) {
        decisionEl.innerText = "ERRORE";
        decisionEl.style.color = "#ef4444";
        activePlayerEl.innerText = "FALLITO";
        tacticBoxEl.innerText = err.message;
      } finally {
        btnAction.disabled = false;
      }
    }

    btnAction.onclick = executeCapture;

    window.addEventListener('keydown', (e) => {
      if (apiModal.style.display !== 'none') return;
      e.preventDefault();
      executeCapture();
    });
  </script>
</body>
</html>

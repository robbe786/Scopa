<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Tresette 1vs1 Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #111; color: #fff; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    
    #camera-container { flex: 1 1 auto; min-height: 0; position: relative; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; }
    video { width: 100%; height: 100%; object-fit: cover; }
    
    #overlay-box { 
      position: absolute; 
      border: 2px dashed #38bdf8; 
      width: 72%; 
      height: 74%; 
      left: 3%; 
      top: 13%; 
      pointer-events: none; 
      border-radius: 8px; 
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.65); 
    }
    
    #dashboard { flex: 0 0 auto; background: #1a1a1a; padding: 12px; display: flex; flex-direction: column; gap: 8px; border-top: 2px solid #333; max-height: 50vh; overflow-y: auto; }
    
    .status-row { display: flex; justify-content: space-between; align-items: center; }
    #decision { font-size: 1.5rem; font-weight: 900; color: #10b981; }
    #game-info { font-size: 0.85rem; color: #aaa; }

    .card-matrix { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: #222; padding: 8px; border-radius: 6px; font-size: 0.75rem; text-align: center; }
    .suit-col { display: flex; flex-direction: column; gap: 2px; }
    .suit-title { font-weight: bold; padding-bottom: 2px; border-bottom: 1px solid #444; margin-bottom: 2px; }
    
    .card-badge { padding: 3px 0; border-radius: 3px; background: #2e2e2e; font-family: monospace; font-size: 0.8rem; }
    .card-in-hand { background: #0284c7; color: #fff; font-weight: bold; border: 1px solid #38bdf8; }
    .card-played { background: #181818; color: #555; text-decoration: line-through; }
    .card-oppo { background: #dc2626; color: #fff; font-weight: bold; border: 1px solid #f87171; }

    .card-h { color: #ef4444; }
    .card-d { color: #38bdf8; }
    .card-c { color: #22c55e; }
    .card-s { color: #f8fafc; }

    #details { font-size: 0.9rem; color: #ccc; min-height: 2.2em; line-height: 1.4; }

    #btn-action { width: 100%; padding: 14px; font-size: 1.1rem; font-weight: bold; color: white; background: #0284c7; border: none; border-radius: 10px; cursor: pointer; }
    #btn-action:disabled { background: #444; color: #888; }

    #api-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: flex; justify-content: center; align-items: center; padding: 20px; z-index: 100; }
    .modal-content { background: #222; padding: 20px; border-radius: 12px; width: 100%; max-width: 350px; }
    .modal-content input { width: 100%; padding: 12px; margin: 12px 0; border-radius: 6px; border: 1px solid #444; background: #111; color: white; font-size: 0.95rem; }
    .modal-content button { width: 100%; padding: 12px; background: #0284c7; border: none; border-radius: 6px; color: white; font-weight: bold; }
  </style>
</head>
<body>

  <div id="api-modal">
    <div class="modal-content">
      <h3>Gemini API Key</h3>
      <input type="text" id="api-key-input" placeholder="Incolla chiave AQ...">
      <button id="save-key-btn">Salva</button>
    </div>
  </div>

  <div id="camera-container">
    <video id="video" autoplay playsinline muted></video>
    <div id="overlay-box"></div>
  </div>

  <div id="dashboard">
    <div class="status-row">
      <div id="decision">IN ATTESA</div>
      <div id="game-info">Mazzo: 20</div>
    </div>

    <div class="card-matrix">
      <div class="suit-col" id="col-c">
        <div class="suit-title card-c">♣ Fiori</div>
      </div>
      <div class="suit-col" id="col-d">
        <div class="suit-title card-d">♦ Quadri</div>
      </div>
      <div class="suit-col" id="col-h">
        <div class="suit-title card-h">♥ Cuori</div>
      </div>
      <div class="suit-col" id="col-s">
        <div class="suit-title card-s">♠ Picche</div>
      </div>
    </div>

    <div id="details">Inquadra il tavolo ed effettua lo scatto.</div>
    <button id="btn-action">SCATTA / LEGGI</button>
  </div>

  <canvas id="canvas" style="display: none;"></canvas>

  <script>
    const SYSTEM_PROMPT = `Sei un computer vision per Tresette 1vs1 su Sisal con carte francesi da 40 carte.
Valori: A, 2, 3, 4, 5, 6, 7, J, Q, K di Cuori(h), Quadri(d), Fiori(c), Picche(s). Non esistono 8, 9 e 10.

Compito:
1. Riconosci TUTTE le carte in mano a Hero in basso ("mie_carte").
2. Se presente, riconosci la carta giocata dall'avversario al centro ("carta_oppo_centro").
3. Se presente, riconosci la carta appena pescata e scoperta in alto a destra dall'avversario ("pescata_oppo").

Restituisci ESCLUSIVAMENTE un JSON valido:
{
  "mie_carte": ["3h", "Ad", "7c"],
  "carta_oppo_centro": "Kh",
  "pescata_oppo": null
}`;

    const POWER = { '3': 10, '2': 9, 'A': 8, 'K': 7, 'Q': 6, 'J': 5, '7': 4, '6': 3, '5': 2, '4': 1 };
    const POINTS = { 'A': 1.0, '3': 0.33, '2': 0.33, 'K': 0.33, 'Q': 0.33, 'J': 0.33, '7': 0, '6': 0, '5': 0, '4': 0 };

    const RANKS = ['3', '2', 'A', 'K', 'Q', 'J', '7', '6', '5', '4'];
    const SUITS = ['c', 'd', 'h', 's'];

    let heroHand = [];
    let oppoKnownHand = new Set();
    let playedCards = new Set();

    function initMatrix() {
      SUITS.forEach(s => {
        const col = document.getElementById(`col-${s}`);
        RANKS.forEach(r => {
          const badge = document.createElement('div');
          badge.className = 'card-badge';
          badge.id = `card-${r}${s}`;
          badge.innerText = `${r}${s.toUpperCase()}`;
          col.appendChild(badge);
        });
      });
    }
    initMatrix();

    function updateMatrixUI() {
      SUITS.forEach(s => {
        RANKS.forEach(r => {
          const id = `${r}${s}`;
          const el = document.getElementById(`card-${id}`);
          if (!el) return;

          if (playedCards.has(id)) {
            el.className = 'card-badge card-played';
          } else if (heroHand.includes(id)) {
            el.className = 'card-badge card-in-hand';
          } else if (oppoKnownHand.has(id)) {
            el.className = 'card-badge card-oppo';
          } else {
            el.className = 'card-badge';
          }
        });
      });
    }

    function calculateBestMove(oppoCard, myCards) {
      if (!myCards || myCards.length === 0) return { card: "N/D", desc: "Nessuna carta rilevata" };

      if (!oppoCard) {
        const lowCards = myCards.filter(c => POINTS[c[0]] === 0).sort((a, b) => POWER[a[0]] - POWER[b[0]]);
        if (lowCards.length > 0) return { card: lowCards[0], desc: "Apri con scartina bassa a zero punti" };

        const padroni = myCards.filter(c => c[0] === '3');
        if (padroni.length > 0) return { card: padroni[0], desc: "Apri con il 3 per incassare la presa" };

        return { card: myCards[0], desc: "Giocata neutra di apertura" };
      }

      const oppoRank = oppoCard.slice(0, -1);
      const oppoSuit = oppoCard.slice(-1);
      const oppoPower = POWER[oppoRank] || 0;
      const isOppoPoint = (POINTS[oppoRank] || 0) > 0;

      const legalCards = myCards.filter(c => c.endsWith(oppoSuit));

      if (legalCards.length > 0) {
        const winningCards = legalCards.filter(c => POWER[c[0]] > oppoPower).sort((a, b) => POWER[a[0]] - POWER[b[0]]);

        if (winningCards.length > 0) {
          return { 
            card: winningCards[0], 
            desc: isOppoPoint ? `Prendi i punti avversari con ${winningCards[0]}` : `Supera la scartina con ${winningCards[0]}` 
          };
        } else {
          legalCards.sort((a, b) => POWER[a[0]] - POWER[b[0]]);
          return { card: legalCards[0], desc: `Cedi la presa lisciando la minima (${legalCards[0]})` };
        }
      } else {
        const trash = myCards.filter(c => POINTS[c[0]] === 0).sort((a, b) => POWER[a[0]] - POWER[b[0]]);
        if (trash.length > 0) return { card: trash[0], desc: `Piombo: scarta scartina ${trash[0]}` };

        myCards.sort((a, b) => POWER[a[0]] - POWER[b[0]]);
        return { card: myCards[0], desc: `Sacrifica pezza bassa (${myCards[0]})` };
      }
    }

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const btnAction = document.getElementById('btn-action');
    const decisionEl = document.getElementById('decision');
    const detailsEl = document.getElementById('details');
    const gameInfoEl = document.getElementById('game-info');
    const apiModal = document.getElementById('api-modal');
    const apiKeyInput = document.getElementById('api-key-input');
    const saveKeyBtn = document.getElementById('save-key-btn');

    let apiKey = localStorage.getItem('GEMINI_API_KEY') || '';

    if (apiKey) {
      apiModal.style.display = 'none';
      startCamera();
    }

    saveKeyBtn.onclick = () => {
      apiKey = apiKeyInput.value.trim();
      if (apiKey) {
        localStorage.setItem('GEMINI_API_KEY', apiKey);
        apiModal.style.display = 'none';
        startCamera();
      }
    };

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { 
            facingMode: { ideal: 'environment' },
            width: { ideal: 1920, min: 1280 },
            height: { ideal: 1080, min: 720 }
          },
          audio: false
        });
        video.srcObject = stream;
        video.setAttribute("playsinline", true);
        await video.play();
      } catch (err) {
        alert("Errore fotocamera: " + err.message);
      }
    }

    btnAction.onclick = async () => {
      if (!apiKey || !video.videoWidth) return;

      btnAction.disabled = true;
      btnAction.innerText = "LETTURA TAVOLO...";

      try {
        const srcWidth = video.videoWidth;
        const srcHeight = video.videoHeight;

        const cropW = srcWidth * 0.72;
        const cropH = srcHeight * 0.74;
        const cropX = srcWidth * 0.03;
        const cropY = (srcHeight - cropH) / 2;

        const targetWidth = 1280;
        canvas.width = targetWidth;
        canvas.height = (cropH / cropW) * targetWidth;

        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, canvas.width, canvas.height);

        const base64Image = canvas.toDataURL('image/jpeg', 0.75).split(',')[1];

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              role: "user",
              parts: [
                { text: SYSTEM_PROMPT },
                { inlineData: { mimeType: "image/jpeg", data: base64Image } }
              ]
            }],
            generationConfig: {
              responseMimeType: "application/json"
            }
          })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error.message);

        const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
        const start = rawText.indexOf('{');
        const end = rawText.lastIndexOf('}');
        const parsed = JSON.parse(rawText.substring(start, end + 1));

        if (parsed.mie_carte && Array.isArray(parsed.mie_carte)) {
          heroHand = parsed.mie_carte;
        }

        if (parsed.pescata_oppo) {
          oppoKnownHand.add(parsed.pescata_oppo);
        }

        if (parsed.carta_oppo_centro) {
          playedCards.add(parsed.carta_oppo_centro);
          oppoKnownHand.delete(parsed.carta_oppo_centro);
        }

        // GESTIONE INTELLIGENTE: SCATTO PESCATA vs SCATTO DECISIONE
        if (parsed.pescata_oppo && !parsed.carta_oppo_centro) {
          decisionEl.innerText = `PESCATA: ${parsed.pescata_oppo}`;
          decisionEl.style.color = "#ef4444";
          detailsEl.innerHTML = `• Carta avversario memorizzata: <b>${parsed.pescata_oppo}</b><br>• Attendi che giochi al centro e riscatta.`;
        } else {
          const best = calculateBestMove(parsed.carta_oppo_centro, heroHand);
          decisionEl.innerText = `GIOCA: ${best.card}`;
          decisionEl.style.color = "#10b981";
          detailsEl.innerHTML = `
            • <b>A terra:</b> ${parsed.carta_oppo_centro || 'Nessuna (Tocca a te)'}<br>
            • <b>Strategia:</b> ${best.desc}<br>
            • <b>Carte note oppo:</b> ${Array.from(oppoKnownHand).join(', ') || 'Nessuna'}
          `;
        }

        gameInfoEl.innerText = `Note oppo: ${oppoKnownHand.size}`;
        updateMatrixUI();

      } catch (err) {
        decisionEl.innerText = "ERRORE";
        decisionEl.style.color = "#ef4444";
        detailsEl.innerText = err.message;
      } finally {
        btnAction.disabled = false;
        btnAction.innerText = "SCATTA / LEGGI";
      }
    };

    // INTERCETTAZIONE DIRETTA TASTI E OTTURATORE BLUETOOTH
    const triggerShot = () => {
      if (!btnAction.disabled) btnAction.click();
    };

    ['keydown', 'keyup'].forEach(eventType => {
      window.addEventListener(eventType, (e) => {
        const k = e.key || '';
        const c = e.code || '';

        if (
          k.includes('Volume') || 
          c.includes('Volume') || 
          k === ' ' || 
          c === 'Space' || 
          k === 'Enter' || 
          c === 'Enter' || 
          c.startsWith('Numpad')
        ) {
          e.preventDefault();
          e.stopPropagation();
          if (eventType === 'keydown') triggerShot();
        }
      }, { passive: false });
    });

    window.addEventListener('pointerdown', (e) => {
      if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') {
        triggerShot();
      }
    });
  </script>
</body>
</html>
